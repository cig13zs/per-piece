<!doctype html>
<meta charset="utf-8">
<title>Per Piece - fixture</title>
<!-- Two adversarial grids in one page.

     Top: a Shopee PH search - obfuscated class names, the peso sign split into
     its own span, struck-through original prices before AND after the current
     one, tiles nested several levels deep.

     Bottom: an Amazon search - the real .a-price shape, where the accurate
     price lives in an opacity-0 .a-offscreen span and the visible one is split
     into symbol / whole / fraction spans that read "$2499" if you concatenate
     them naively. Amazon also prints its own rate next to the item price, so
     every tile holds two things shaped like a price and only one of them is
     what you pay. Both details were taken off a live amazon.com search.

     Both grids on one page also prove the ranking is grouped by currency: the
     dollar tiles must never be ranked against the peso tiles, and no badge may
     ever print the wrong symbol. Open in a browser to verify content.js end to
     end. -->
<link rel="stylesheet" href="../content.css">
<style>
  body { font: 14px system-ui, sans-serif; background: #f6f6f6; margin: 0; padding: 18px; }
  h2 { font-size: 15px; margin: 22px 0 14px; color: #333; }
  h2:first-of-type { margin-top: 0; }
  .r7Kx { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .Jq2p { background: #fff; border-radius: 6px; overflow: hidden; }
  .m9Vc { padding: 9px; }
  .t3Wd { font-size: 12.5px; line-height: 1.35; height: 52px; overflow: hidden; color: #222; }
  .p1Zk { margin-top: 6px; color: #ee4d2d; font-weight: 700; font-size: 15px; }
  .o8Bn { color: #999; font-size: 11.5px; text-decoration: line-through; margin-left: 5px; font-weight: 400; }
  .img { height: 92px; background: linear-gradient(135deg,#e8e8e8,#d6d6d6); }

  /* Amazon's own markup, near enough. */
  /* Exactly how amazon.com hides it, verified on a live search: absolutely
     positioned and opacity 0, at full text size. Anything measuring the box
     concludes it is visible. */
  .a-offscreen { position: absolute; left: 0; opacity: 0; white-space: nowrap; }
  .a-price { color: #0f1111; font-weight: 400; }
  .a-price-symbol { font-size: 11px; vertical-align: super; }
  .a-price-whole { font-size: 20px; }
  .a-price-fraction { font-size: 11px; vertical-align: super; }
  .a-text-price { color: #565959; font-size: 12px; text-decoration: line-through; }
  .a-title { font-size: 13px; line-height: 1.35; height: 54px; overflow: hidden; color: #0f1111; }
</style>

<h2>gatas / powdered milk &mdash; shopee.ph</h2>
<div class="r7Kx" id="grid"></div>

<h2>coffee &mdash; amazon.com</h2>
<div class="r7Kx" id="amz"></div>

<script>
const ITEMS = [
  ['Bear Brand Powdered Milk 300g', 62, 0],
  ['Bear Brand Powdered Milk 300g x 6 BUNDLE SALE PROMO', 560, 720],
  ['Alaska Fortified Powdered Milk 1.2kg', 310, 0],
  ['Nido Fortigrow Full Cream Milk Powder 700g', 189, 240],
  ['Anchor Full Cream Milk Powder 900g Twin Pack', 495, 0],
  ['Biogesic Paracetamol 500mg 10s', 52, 0],
  ['Biogesic Paracetamol 500mg 100s Bottle', 420, 0],
  ['iPhone 15 Pro Max 256GB Natural Titanium', 71990, 0],
  ['Backpack 30L Waterproof Travel Laptop Bag', 899, 1299],
  // Lazada-style: struck original rendered BEFORE the current price. Must read
  // 148, not 260 -> P29.6/100g. Reading the struck value would badge P52/100g.
  ['Milo Activ-Go Chocolate Powder 500g', 148, 260, 'first'],
];

const peso = (n) => n.toLocaleString('en-PH', { minimumFractionDigits: n % 1 ? 2 : 0 });

const old = (o) => (o ? `<span class="o8Bn">₱${peso(o)}</span>` : '');

document.getElementById('grid').innerHTML = ITEMS.map(([t, p, o, where]) => `
  <div class="Jq2p"><div class="img"></div><div class="m9Vc">
    <div class="t3Wd">${t}</div>
    <div class="p1Zk">${where === 'first' ? old(o) : ''}<span>₱</span><span>${
      peso(p)}</span>${where === 'first' ? '' : old(o)}</div>
  </div></div>`).join('');

// [title, price, was]. The three coffee bags are the whole demo: the biggest
// bag is not the cheapest per 100g.
const AMZ = [
  ['Starbucks Pike Place Roast Ground Coffee, 12 oz Bag', 8.48, 0],
  ['Death Wish Coffee Ground Coffee, 16 oz', 19.99, 24.99],
  ['Community Coffee Cafe Special Ground Coffee 32 oz', 24.99, 0],
  ['Folgers Classic Roast Ground Coffee, 43.5 Ounce', 12.38, 0],
  ['Nespresso Capsules VertuoLine, 30 Count', 41.7, 0],
  ['Keurig K-Cup Pods Variety Pack of 42', 29.99, 34.99],
  // Must stay blank: a machine's capacity is not what you drink.
  ['Cuisinart Coffee Maker 14 Cup Programmable Carafe', 79.95, 0],
  ['Ninja Air Fryer 4L Digital Countertop', 119.99, 0],
];

// Amazon's own per-ounce rate, printed beside the price on most grocery
// tiles. It must never be read as the price of anything.
const rate = (t, p) => {
  const m = t.match(/([\d.]+)\s*(?:oz|ounce)/i);
  return m ? (p / parseFloat(m[1])).toFixed(2) : null;
};

document.getElementById('amz').innerHTML = AMZ.map(([t, p, o]) => {
  const [w, f] = p.toFixed(2).split('.');
  const r = rate(t, p);
  return `
  <div class="Jq2p"><div class="img"></div><div class="m9Vc">
    <div class="a-title">${t}</div>
    <div style="margin-top:6px">
      <span class="a-price"><span class="a-offscreen">$${p.toFixed(2)}</span><span
        aria-hidden="true"><span class="a-price-symbol">$</span><span
        class="a-price-whole">${w}</span><span class="a-price-fraction">${f}</span></span></span>
      ${r ? ` (<span class="a-price a-text-price"><span class="a-offscreen">$${r}</span><span
        aria-hidden="true">$${r}</span></span>/ounce)` : ''}
      ${o ? `<span class="a-text-price">List: $${o.toFixed(2)}</span>` : ''}
    </div>
  </div></div>`;
}).join('');
</script>

<!-- Minimal chrome API shim so the real content script runs unmodified. -->
<script>
window.chrome = {
  storage: {
    local: { get: (d, cb) => cb(d), set: () => {} },
    onChanged: { addListener: () => {} },
  },
  runtime: { onMessage: { addListener: () => {} } },
};
</script>
<script src="../parse.js"></script>
<script src="../content.js"></script>
