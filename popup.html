<!doctype html>
<meta charset="utf-8">
<title>Per Piece</title>
<style>
  :root { color-scheme: light dark; }
  body {
    width: 258px; margin: 0; padding: 14px 15px 13px;
    font: 13px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #fff; color: #1d232a;
  }
  h1 { margin: 0 0 2px; font-size: 14px; letter-spacing: -.1px; }
  p { margin: 0; color: #5d6772; font-size: 12px; }
  .row {
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; margin-top: 13px; padding-top: 12px; border-top: 1px solid #e8ecf0;
  }
  label { font-weight: 600; }
  .sw { position: relative; width: 38px; height: 22px; flex: none; }
  .sw input { opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
  .tr {
    position: absolute; inset: 0; border-radius: 11px; background: #c8d0d8;
    transition: background .15s; pointer-events: none;
  }
  .tr::after {
    content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px;
    border-radius: 50%; background: #fff; transition: transform .15s;
  }
  .sw input:checked + .tr { background: #1f9d55; }
  .sw input:checked + .tr::after { transform: translateX(16px); }
  .key { margin-top: 12px; display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    padding: 1px 6px; border-radius: 4px; border: 1px solid;
    font-size: 11px; font-weight: 600;
  }
  .b { background: #e3f7ea; border-color: #7ed39b; color: #14663a; }
  .w { background: #fdeaea; border-color: #f0a3a3; color: #a11a1a; }
  .n { background: #eef1f4; border-color: #d8dee5; color: #3d4752; }
  .foot { margin-top: 12px; font-size: 11px; color: #7c8590; }
  @media (prefers-color-scheme: dark) {
    body { background: #171b20; color: #e6eaef; }
    p { color: #98a2ad; } .row { border-color: #2a3038; } .foot { color: #808a95; }
    .b { background:#14331f; border-color:#2f7a4d; color:#7fe0a6; }
    .w { background:#3a1a1a; border-color:#8a3838; color:#ff9c9c; }
    .n { background:#2a3038; border-color:#3c444e; color:#cbd3dc; }
  }
</style>

<h1>Per Piece</h1>
<p>Works on Shopee and Lazada Philippines.</p>

<div class="row">
  <label for="t">Show unit prices</label>
  <span class="sw"><input type="checkbox" id="t" checked><span class="tr"></span></span>
</div>

<div class="key">
  <span class="chip b">₱20.67/100g ✓ best</span>
  <span class="chip n">₱23.30/100g</span>
  <span class="chip w">₱45/100g</span>
</div>

<p class="foot">Nothing is collected or sent anywhere. All the maths runs on this
device. A tile stays blank when the size cannot be read with confidence.</p>

<script src="popup.js"></script>
